<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🥗 Калорийность — Моя кухня</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@1&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root{--cream:#fdf6ec;--warm:#f5e6d0;--brown:#5c3d2e;--amber:#d4843a;--amber-light:#e8a85f;--text:#2e1f14;--text-soft:#7a5c4a;--white:#fff;--shadow:rgba(92,61,46,0.15);}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Lato',sans-serif;background:var(--cream);color:var(--text);min-height:100vh;}
    .header{background:var(--brown);padding:44px 24px 24px;}
    .back-btn{display:flex;align-items:center;gap:8px;color:var(--amber-light);font-size:14px;cursor:pointer;background:none;border:none;padding:0;margin-bottom:16px;font-family:'Lato',sans-serif;text-decoration:none;}
    .page-title{font-family:'Playfair Display',serif;font-size:24px;color:var(--cream);}
    .page-sub{font-size:13px;color:var(--amber-light);margin-top:4px;}
    .body{padding:20px;max-width:600px;}
    .card{background:var(--white);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 2px 12px var(--shadow);}
    .card-label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--amber);font-weight:700;display:block;margin-bottom:8px;}
    .key-input{width:100%;padding:10px 14px;border-radius:10px;border:2px solid var(--warm);font-size:14px;font-family:monospace;outline:none;}
    .key-input:focus{border-color:var(--amber);}
    .key-note{font-size:12px;color:var(--text-soft);margin-top:6px;}
    .btn{padding:12px 20px;border-radius:12px;border:none;font-size:14px;font-weight:700;cursor:pointer;font-family:'Lato',sans-serif;transition:transform .15s;}
    .btn:active{transform:scale(.97);}
    .btn-primary{background:var(--brown);color:var(--cream);width:100%;padding:14px;font-size:15px;border-radius:14px;margin-top:10px;}
    .btn-secondary{background:var(--warm);color:var(--brown);width:100%;padding:12px;border-radius:12px;margin-bottom:8px;}
    .btn:disabled{opacity:.5;cursor:default;}
    .stats-row{display:flex;gap:12px;margin-bottom:14px;}
    .stat-card{flex:1;background:var(--warm);border-radius:12px;padding:12px;text-align:center;}
    .stat-num{font-size:24px;font-weight:700;color:var(--brown);}
    .stat-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-soft);margin-top:3px;}
    .progress-bar{background:var(--warm);border-radius:8px;height:8px;margin:10px 0;overflow:hidden;}
    .progress-fill{background:var(--amber);height:100%;width:0%;transition:width .3s;border-radius:8px;}
    #status-msg{font-size:13px;color:var(--text-soft);padding:6px 0;min-height:18px;}
    .ing-table{width:100%;border-collapse:collapse;}
    .ing-table th{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--amber);font-weight:700;text-align:left;padding:6px 4px;border-bottom:2px solid var(--warm);}
    .ing-table td{font-size:13px;padding:7px 4px;border-bottom:1px solid var(--warm);vertical-align:middle;}
    .ing-table tr:last-child td{border-bottom:none;}
    .td-name{color:var(--text);font-weight:500;max-width:130px;word-break:break-word;}
    .td-count{color:var(--text-soft);font-size:11px;text-align:center;}
    .td-nut{color:var(--brown);font-weight:700;text-align:right;}
    .td-missing{color:#c0784a;font-size:11px;font-style:italic;}
    .lookup-one-btn{padding:4px 9px;border-radius:10px;border:2px solid var(--amber);background:transparent;color:var(--amber);font-size:11px;font-weight:700;cursor:pointer;font-family:'Lato',sans-serif;white-space:nowrap;}
    .lookup-one-btn:disabled{opacity:.5;}
    .table-title-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  </style>
</head>
<body>

<div class="header">
  <a class="back-btn" href="index.html">← Моя кухня</a>
  <div class="page-title">🥗 База калорийности</div>
  <div class="page-sub">Питательные ценности ингредиентов · <a href="tools/migrate-recipes.html" style="color:var(--amber-light)">🔧 миграция рецептов</a></div>
</div>

<div class="body">
  <div class="card">
    <label class="card-label">OpenAI API Key</label>
    <input class="key-input" type="password" id="api-key" placeholder="sk-…" autocomplete="off"/>
    <div class="key-note">Используется только в браузере — никуда не отправляется кроме OpenAI</div>
  </div>

  <div class="card">
    <div id="stats-row" class="stats-row" style="display:none">
      <div class="stat-card"><div class="stat-num" id="stat-total">0</div><div class="stat-label">ингредиентов</div></div>
      <div class="stat-card"><div class="stat-num" id="stat-found">0</div><div class="stat-label">с данными</div></div>
      <div class="stat-card"><div class="stat-num" id="stat-missing">0</div><div class="stat-label">нет данных</div></div>
    </div>
    <button class="btn btn-secondary" onclick="scanAll()">🔍 Сканировать все рецепты</button>
    <button class="btn btn-secondary" id="fix-unitg-btn" onclick="fixMissingUnitG()" style="display:none">🔄 Обновить unitG (штучные ингредиенты)</button>
    <button class="btn btn-secondary" id="enrich-btn" onclick="enrichDictionary()" style="display:none">🏷️ Обогатить справочник (категория · staple · хранение)</button>
    <button class="btn btn-secondary" id="micros-btn" onclick="fillMicros()" style="display:none">🩸 Добавить клетчатку · калий · фосфор</button>
    <button class="btn btn-primary" id="lookup-btn" onclick="lookupAllMissing()" style="display:none">✨ Заполнить отсутствующие через GPT</button>
    <div id="progress-wrap" style="display:none"><div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div></div>
    <div id="status-msg"></div>
  </div>

  <div id="table-card" class="card" style="display:none">
    <div class="table-title-row">
      <label class="card-label" style="margin-bottom:0" id="table-title">Ингредиенты</label>
    </div>
    <table class="ing-table">
      <thead><tr><th>Ингредиент</th><th style="text-align:center">×</th><th style="text-align:right">ккал</th><th style="text-align:right">Б</th><th style="text-align:right">Ж</th><th style="text-align:right">У</th><th style="text-align:right">Клетч</th><th style="text-align:right">K</th><th style="text-align:right">P</th><th></th></tr></thead>
      <tbody id="ing-tbody"></tbody>
    </table>
  </div>
</div>

<script type="module">
import { db, collection, getDocs, doc, setDoc, authReady } from './js/firebase.js';
await authReady; // запросы должны уйти с auth-токеном (см. firestore.rules)
import { escHtml, normalizeIngName as normalize, getOpenAIKey, setOpenAIKey } from './js/utils.js';
import { callNutritionGPT as callGPTShared, callJsonGPT, nutritionPayload, expandIngredients, buildDict } from './js/nutrition.js';

let ingredientMap = {};  // normalizedKey → { display, count }
let nutritionData = {};  // canonicalKey → { kcal, protein, fat, carbs, unitG?, aliases?… }
let aliasMap = {};       // синоним → канонический ключ

const canon = k => aliasMap[k] || k;
const resolved = k => nutritionData[canon(k)];

const savedKey = getOpenAIKey();
if (savedKey) document.getElementById('api-key').value = savedKey;
document.getElementById('api-key').addEventListener('change', e => {
  setOpenAIKey(e.target.value);
});

window.scanAll = async function() {
  setStatus('Загружаю рецепты…');
  const [recipesSnap, nutSnap] = await Promise.all([
    getDocs(collection(db, 'recipes')),
    getDocs(collection(db, 'nutrition'))
  ]);

  nutritionData = {};
  nutSnap.docs.forEach(d => { nutritionData[d.id] = d.data(); });
  aliasMap = buildDict(nutritionData).alias;

  ingredientMap = {};
  recipesSnap.docs.forEach(d => {
    expandIngredients(d.data().ingredients).forEach(ing => {
      if (!ing.n) return;
      const key = ing.ing || normalize(ing.n); // канонический ключ, если рецепт мигрирован
      if (!key) return;
      if (!ingredientMap[key]) ingredientMap[key] = { display: ing.n, count: 0 };
      ingredientMap[key].count++;
    });
  });

  const keys = Object.keys(ingredientMap);
  const foundCount = keys.filter(k => resolved(k)).length;
  const missingCount = keys.length - foundCount;

  document.getElementById('stats-row').style.display = 'flex';
  document.getElementById('stat-total').textContent = keys.length;
  document.getElementById('stat-found').textContent = foundCount;
  document.getElementById('stat-missing').textContent = missingCount;

  if (missingCount > 0) {
    const btn = document.getElementById('lookup-btn');
    btn.style.display = 'block';
    btn.textContent = `✨ Заполнить ${missingCount} отсутствующих через GPT`;
  }

  const noUnitGCount = [...new Set(keys.map(canon))].filter(k => nutritionData[k] && !nutritionData[k].unitG).length;
  if (noUnitGCount > 0) {
    const fixBtn = document.getElementById('fix-unitg-btn');
    fixBtn.style.display = 'block';
    fixBtn.textContent = `🔄 Обновить unitG для ${noUnitGCount} ингредиентов`;
  }

  const noCategoryCount = Object.keys(nutritionData).filter(k => !nutritionData[k].category).length;
  if (noCategoryCount > 0) {
    const enrichBtn = document.getElementById('enrich-btn');
    enrichBtn.style.display = 'block';
    enrichBtn.textContent = `🏷️ Обогатить ${noCategoryCount} записей (категория · staple · хранение)`;
  }

  // Записи без клетчатки/калия/фосфора — их «Заполнить отсутствующие» не
  // трогает (у них уже есть ккал), поэтому нужна отдельная дозаливка.
  const noMicrosCount = Object.keys(nutritionData)
    .filter(k => nutritionData[k].fiber == null || nutritionData[k].potassium == null || nutritionData[k].phosphorus == null).length;
  const microsBtn = document.getElementById('micros-btn');
  if (noMicrosCount > 0) {
    microsBtn.style.display = 'block';
    microsBtn.textContent = `🩸 Добавить клетчатку · калий · фосфор для ${noMicrosCount} записей`;
  } else microsBtn.style.display = 'none';

  renderTable(keys);
  setStatus(`${keys.length} уникальных ингредиентов · ${foundCount} с данными · ${missingCount} нужно добавить`);
};

function renderTable(keys) {
  keys = [...keys].sort((a, b) => {
    const am = !resolved(a), bm = !resolved(b);
    if (am !== bm) return am ? -1 : 1;
    return a.localeCompare(b, 'ru');
  });
  const tbody = document.getElementById('ing-tbody');
  tbody.innerHTML = keys.map(k => {
    const nut = resolved(k);
    const info = ingredientMap[k];
    const escapedKey = escHtml(k.replace(/\\/g, '\\\\').replace(/'/g, "\\'"));
    const micro = v => v == null ? '<span style="color:#c0392b">—</span>' : Math.round(v);
    if (nut) {
      return `<tr>
        <td class="td-name">${escHtml(info.display)}</td>
        <td class="td-count">${info.count}</td>
        <td class="td-nut">${Math.round(nut.kcal)}</td>
        <td class="td-nut">${nut.protein}</td>
        <td class="td-nut">${nut.fat}</td>
        <td class="td-nut">${nut.carbs}</td>
        <td class="td-nut">${micro(nut.fiber)}</td>
        <td class="td-nut">${micro(nut.potassium)}</td>
        <td class="td-nut">${micro(nut.phosphorus)}</td>
        <td></td>
      </tr>`;
    }
    return `<tr>
      <td class="td-name">${escHtml(info.display)}</td>
      <td class="td-count">${info.count}</td>
      <td colspan="7" class="td-missing">нет данных</td>
      <td><button class="lookup-one-btn" id="btn-${escHtml(k)}" onclick="lookupOne('${escapedKey}')" type="button">GPT</button></td>
    </tr>`;
  }).join('');
  document.getElementById('table-card').style.display = 'block';
}

async function callGPT(names) {
  const apiKey = document.getElementById('api-key').value.trim();
  if (!apiKey) { setStatus('⚠️ Введи OpenAI API key'); throw new Error('no key'); }
  setOpenAIKey(apiKey);
  return callGPTShared(names, apiKey);
}

async function saveNutritionResult(result, batch) {
  for (const [name, vals] of Object.entries(result)) {
    const payload = nutritionPayload(vals);
    if (!payload) continue;
    const normName = normalize(name);
    const key = batch.find(k => k === normName) ||
                batch.find(k => ingredientMap[k]?.display.toLowerCase() === name.toLowerCase()) ||
                normName;
    nutritionData[key] = payload;
    await setDoc(doc(db, 'nutrition', key), payload);
  }
}

window.lookupAllMissing = async function() {
  const missing = Object.keys(ingredientMap).filter(k => !resolved(k));
  if (!missing.length) return;

  const btn = document.getElementById('lookup-btn');
  btn.disabled = true;

  const progressWrap = document.getElementById('progress-wrap');
  const progressFill = document.getElementById('progress-fill');
  progressWrap.style.display = 'block';

  const BATCH = 25;
  let processed = 0;

  for (let i = 0; i < missing.length; i += BATCH) {
    const batch = missing.slice(i, i + BATCH);
    const displayNames = batch.map(k => ingredientMap[k].display);
    setStatus(`GPT: ${i + 1}–${Math.min(i + BATCH, missing.length)} из ${missing.length}…`);
    try {
      const result = await callGPT(displayNames);
      await saveNutritionResult(result, batch);
      processed += batch.length;
      progressFill.style.width = `${(processed / missing.length) * 100}%`;
    } catch (e) {
      if (e.message !== 'no key') setStatus('❌ ' + e.message);
      btn.disabled = false;
      return;
    }
  }

  const keys = Object.keys(ingredientMap);
  const foundCount = keys.filter(k => resolved(k)).length;
  document.getElementById('stat-found').textContent = foundCount;
  document.getElementById('stat-missing').textContent = keys.length - foundCount;
  renderTable(keys);
  setStatus(`✅ Готово! Данные загружены для ${processed} ингредиентов.`);
  btn.disabled = false;
  btn.style.display = 'none';
};

window.lookupOne = async function(key) {
  const displayName = ingredientMap[key]?.display || key;
  const btn = document.getElementById(`btn-${key}`);
  if (btn) { btn.disabled = true; btn.textContent = '…'; }
  setStatus(`Запрашиваю «${displayName}»…`);
  try {
    const result = await callGPT([displayName]);
    await saveNutritionResult(result, [key]);
    renderTable(Object.keys(ingredientMap));
    const found = Object.keys(ingredientMap).filter(k => resolved(k)).length;
    document.getElementById('stat-found').textContent = found;
    document.getElementById('stat-missing').textContent = Object.keys(ingredientMap).length - found;
    setStatus(`✅ Данные для «${displayName}» сохранены.`);
  } catch (e) {
    if (e.message !== 'no key') setStatus('❌ ' + e.message);
    if (btn) { btn.disabled = false; btn.textContent = 'GPT'; }
  }
};

window.fixMissingUnitG = async function() {
  const noUnitG = [...new Set(Object.keys(ingredientMap).map(canon))].filter(k => nutritionData[k] && !nutritionData[k].unitG);
  if (!noUnitG.length) { setStatus('✅ У всех ингредиентов уже есть unitG.'); return; }

  const btn = document.getElementById('fix-unitg-btn');
  btn.disabled = true;
  const progressWrap = document.getElementById('progress-wrap');
  const progressFill = document.getElementById('progress-fill');
  progressWrap.style.display = 'block'; progressFill.style.width = '0%';

  const BATCH = 25;
  let processed = 0;
  for (let i = 0; i < noUnitG.length; i += BATCH) {
    const batch = noUnitG.slice(i, i + BATCH);
    const displayNames = batch.map(k => ingredientMap[k].display);
    setStatus(`Обновляю unitG: ${i + 1}–${Math.min(i + BATCH, noUnitG.length)} из ${noUnitG.length}…`);
    try {
      const result = await callGPT(displayNames);
      for (const [name, vals] of Object.entries(result)) {
        if (!vals || vals.unitG == null) continue;
        const normName = normalize(name);
        const key = batch.find(k => k === normName) ||
                    batch.find(k => ingredientMap[k]?.display.toLowerCase() === name.toLowerCase()) ||
                    normName;
        if (!nutritionData[key]) continue;
        nutritionData[key] = { ...nutritionData[key], unitG: +vals.unitG };
        await setDoc(doc(db, 'nutrition', key), nutritionData[key]);
      }
      processed += batch.length;
      progressFill.style.width = `${(processed / noUnitG.length) * 100}%`;
    } catch (e) {
      if (e.message !== 'no key') setStatus('❌ ' + e.message);
      btn.disabled = false; return;
    }
  }
  renderTable(Object.keys(ingredientMap));
  setStatus(`✅ unitG обновлён для ${processed} ингредиентов.`);
  btn.disabled = false;
};

// ── ОБОГАЩЕНИЕ СПРАВОЧНИКА ──
// Категория, pantry-staple, скоропортящесть и хранение — нужны планировщику
// и списку покупок (staples не попадают в список, скоропорт — ближе к закупке).
const ENRICH_PROMPT = `Ты кулинарный справочник. Для каждого ингредиента из запроса верни ОДИН JSON-объект: ключ — название точно как в запросе, значение:
- category: "vegetable|fruit|meat|poultry|fish|seafood|dairy|egg|grain|legume|nut|oil|spice|herb|sauce|sweet|other"
- isPantryStaple: true если это базовый запас, который обычно есть дома и не нужно вносить в список покупок каждый раз (соль, сахар, мука, растительное масло, сушёные специи, крупы)
- perishability: "days_2|days_5|weeks_2|months|non_perishable" — срок хранения после покупки
- storage: "fridge|freezer|pantry" — где обычно хранится до готовки`;

window.enrichDictionary = async function() {
  const apiKey = document.getElementById('api-key').value.trim();
  if (!apiKey) { setStatus('⚠️ Введи OpenAI API key'); return; }
  setOpenAIKey(apiKey);

  const noCategory = Object.keys(nutritionData).filter(k => !nutritionData[k].category);
  if (!noCategory.length) { setStatus('✅ Справочник уже обогащён.'); return; }

  const btn = document.getElementById('enrich-btn');
  btn.disabled = true;
  const progressWrap = document.getElementById('progress-wrap');
  const progressFill = document.getElementById('progress-fill');
  progressWrap.style.display = 'block'; progressFill.style.width = '0%';

  const CATS = ['vegetable','fruit','meat','poultry','fish','seafood','dairy','egg','grain','legume','nut','oil','spice','herb','sauce','sweet','other'];
  const PERISH = ['days_2','days_5','weeks_2','months','non_perishable'];
  const STORAGE = ['fridge','freezer','pantry'];

  const BATCH = 25;
  let processed = 0;
  for (let i = 0; i < noCategory.length; i += BATCH) {
    const batch = noCategory.slice(i, i + BATCH);
    setStatus(`Обогащаю: ${i + 1}–${Math.min(i + BATCH, noCategory.length)} из ${noCategory.length}…`);
    try {
      const result = await callJsonGPT(ENRICH_PROMPT,
        'Верни JSON для всех этих ингредиентов: ' + batch.join(', '), apiKey);
      for (const [name, vals] of Object.entries(result)) {
        if (!vals) continue;
        const normName = normalize(name);
        const key = batch.find(k => k === normName) || normName;
        if (!nutritionData[key]) continue;
        const extra = {};
        if (CATS.includes(vals.category)) extra.category = vals.category;
        if (typeof vals.isPantryStaple === 'boolean') extra.isPantryStaple = vals.isPantryStaple;
        if (PERISH.includes(vals.perishability)) extra.perishability = vals.perishability;
        if (STORAGE.includes(vals.storage)) extra.storage = vals.storage;
        if (!Object.keys(extra).length) continue;
        nutritionData[key] = { ...nutritionData[key], ...extra };
        await setDoc(doc(db, 'nutrition', key), nutritionData[key]);
      }
      processed += batch.length;
      progressFill.style.width = `${(processed / noCategory.length) * 100}%`;
    } catch (e) {
      setStatus('❌ ' + e.message);
      btn.disabled = false; return;
    }
  }
  setStatus(`✅ Справочник обогащён: ${processed} записей.`);
  btn.disabled = false;
  btn.style.display = 'none';
};

// ── ДОЗАЛИВКА МИКРОЭЛЕМЕНТОВ ──
// «Заполнить отсутствующие» берёт только записи вообще без данных; у уже
// заполненных ингредиентов клетчатки/калия/фосфора нет, а перезапрашивать
// их надо отдельно. Общий nutrition-промпт уже возвращает эти поля —
// подмешиваем ТОЛЬКО их, не трогая проверенные ккал/Б/Ж/У.
window.fillMicros = async function() {
  const need = Object.keys(nutritionData)
    .filter(k => nutritionData[k].fiber == null || nutritionData[k].potassium == null || nutritionData[k].phosphorus == null);
  if (!need.length) { setStatus('✅ У всех записей уже есть клетчатка/калий/фосфор.'); return; }

  const btn = document.getElementById('micros-btn');
  btn.disabled = true;
  const progressWrap = document.getElementById('progress-wrap');
  const progressFill = document.getElementById('progress-fill');
  progressWrap.style.display = 'block'; progressFill.style.width = '0%';

  const BATCH = 25;
  let processed = 0, updated = 0;
  for (let i = 0; i < need.length; i += BATCH) {
    const batch = need.slice(i, i + BATCH);
    setStatus(`Микроэлементы: ${i + 1}–${Math.min(i + BATCH, need.length)} из ${need.length}…`);
    try {
      // имена = канонические ключи (мука, гречка…) — совпадение точное
      const result = await callGPT(batch);
      for (const [name, vals] of Object.entries(result)) {
        if (!vals) continue;
        const normName = normalize(name);
        const key = batch.find(k => k === normName) || normName;
        if (!nutritionData[key]) continue;
        const extra = {};
        for (const m of ['fiber', 'potassium', 'phosphorus']) {
          const v = vals[m];
          if (v != null && !isNaN(+v)) extra[m] = +v;
        }
        if (!Object.keys(extra).length) continue;
        nutritionData[key] = { ...nutritionData[key], ...extra };
        await setDoc(doc(db, 'nutrition', key), nutritionData[key]);
        updated++;
      }
      processed += batch.length;
      progressFill.style.width = `${(processed / need.length) * 100}%`;
    } catch (e) {
      if (e.message !== 'no key') setStatus('❌ ' + e.message);
      btn.disabled = false; return;
    }
  }
  renderTable(Object.keys(ingredientMap));
  setStatus(`✅ Микроэлементы добавлены: ${updated} из ${need.length} записей.`);
  btn.disabled = false;
  if (updated >= need.length) btn.style.display = 'none';
};

function setStatus(msg) { document.getElementById('status-msg').textContent = msg; }
</script>
</body>
</html>
